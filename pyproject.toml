[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blindspot"
version = "0.1.0"
description = "Find gaps in your knowledge using NLP-powered concept graph analysis"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Zanden Kane"},
]
keywords = ["nlp", "education", "knowledge-gaps", "concept-graph", "spacy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]
dependencies = [
    "networkx>=3.0",
    "click>=8.0",
    "flask>=2.3",
    "pyvis>=0.3",
    "spacy>=3.5,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.scripts]
blindspot = "blindspot.cli:main"

[project.urls]
Homepage = "https://github.com/zandenkane/blindspot"
Repository = "https://github.com/zandenkane/blindspot"
Issues = "https://github.com/zandenkane/blindspot/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/blindspot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
